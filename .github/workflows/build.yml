name: Build Executables

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: 招标公告抓取工具
  APP_BUNDLE_ID: com.yfbzb.scraper
  PYTHON_VERSION: "3.11"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "${{ env.APP_NAME }}" `
            --add-data "config.py;." `
            --add-data "scraper.py;." `
            --add-data "exporter.py;." `
            --hidden-import "requests" `
            --hidden-import "bs4" `
            --hidden-import "lxml" `
            --hidden-import "pandas" `
            --hidden-import "openpyxl" `
            --hidden-import "tqdm" `
            gui_app.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: Windows-BidScraper
          path: dist/*.exe

  build-macos:
    name: Build macOS (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            label: Intel
            python_arch: x64
            target_arch: x86_64
            artifact_suffix: Intel
            dmg_name: BidScraper-Mac-Intel.dmg
            zip_name: BidScraper-Mac-Intel.zip
          - runner: macos-15
            label: AppleSilicon
            python_arch: arm64
            target_arch: arm64
            artifact_suffix: AppleSilicon
            dmg_name: BidScraper-Mac-AppleSilicon.dmg
            zip_name: BidScraper-Mac-AppleSilicon.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Build macOS app bundle
        run: |
          python3 -m PyInstaller --noconfirm --windowed \
            --name "$APP_NAME" \
            --add-data "config.py:." \
            --add-data "scraper.py:." \
            --add-data "exporter.py:." \
            --hidden-import "requests" \
            --hidden-import "bs4" \
            --hidden-import "lxml" \
            --hidden-import "pandas" \
            --hidden-import "openpyxl" \
            --hidden-import "tqdm" \
            --collect-all "lxml" \
            --osx-bundle-identifier "$APP_BUNDLE_ID" \
            --target-arch "${{ matrix.target_arch }}" \
            gui_app.py

      - name: Package macOS artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "${{ matrix.zip_name }}"
          hdiutil create -volname "$APP_NAME" -srcfolder "dist/$APP_NAME.app" -ov -format UDZO "${{ matrix.dmg_name }}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macOS-BidScraper-${{ matrix.artifact_suffix }}
          path: |
            ${{ matrix.zip_name }}
            ${{ matrix.dmg_name }}

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
